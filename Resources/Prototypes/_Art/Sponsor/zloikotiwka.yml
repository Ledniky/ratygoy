- type: entity
  parent: ClothingOuterHardsuitEngineeringWhite
  id: ClothingOuterHardsuitEngineeringWhiteZloikotiwka
  name: chief engineer's hardsuit
  description: A special hardsuit that protects against hazardous, low pressure environments, made for the chief engineer of the station.
  components:
  - type: Sprite
    sprite: _Art/Sponsor/Zloikotiwka/outer.rsi
  - type: Clothing
    sprite: _Art/Sponsor/Zloikotiwka/outer.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitEngineeringWhiteZloikotiwka

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitEngineeringWhiteZloikotiwka
  name: chief engineer's hardsuit helmet
  description: Special hardsuit helmet, made for the chief engineer of the station.
  components:
  - type: Sprite
    sprite: _Art/Sponsor/Zloikotiwka/helmet.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: FireProtection
    reduction: 0.2
  - type: PointLight
    color: "#FFADF6"