- type: entity
  id: MaterialBox
  name: material box
  description: A large storage container for holding construction material.
  parent: OreBox
  components:
  - type: Sprite
    noRot: true
    sprite: Textures/_Art/Structures/Storage/material_box.rsi
    layers:
    - state: material_box
    - state: material_top
      map: [ top ]
      visible: true
  - type: Storage
    grid:
    - 0,0,19,9
    maxItemSize: Normal
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
    whitelist:
      tags:
      - ConstructionMaterial
